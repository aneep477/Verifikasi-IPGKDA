<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Verifikasi Pentaksiran Berterusan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Gaya skrin */
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 24px;
            margin-bottom: 20px;
        }
        .glass-input, .glass-select, .glass-textarea {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            padding: 10px 14px;
            color: white;
            width: 100%;
        }
        label { color: #f3e8ff; font-weight: 500; display: block; margin-bottom: 5px; }
        .btn-primary {
            background: linear-gradient(90deg, #8b5cf6, #ec4899);
            border-radius: 40px;
            padding: 10px 24px;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        .tab-btn {
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            margin-right: 10px;
        }
        .tab-active { background: rgba(255,255,255,0.4); font-weight: bold; }
        .file-drop-area {
            border: 2px dashed white;
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
        }
        /* Gaya cetakan (template asal) */
        @media print {
            body {
                background: white;
                padding: 0.5in;
                margin: 0;
                font-family: 'Times New Roman', Times, serif;
            }
            .no-print, .tab-buttons, .btn-primary, .file-drop-area, button, .glass-card, .backdrop-blur {
                display: none !important;
            }
            .glass-card, .tab-content, form, div, input, select, textarea, label {
                background: white !important;
                color: black !important;
                border-color: black !important;
                box-shadow: none !important;
            }
            input, textarea, select {
                border: 1px solid #000 !important;
                background: white !important;
            }
            .glass-input, .glass-select, .glass-textarea {
                background: white !important;
                color: black !important;
            }
            label {
                color: black !important;
                font-weight: bold;
            }
            .print-item-list {
                margin-top: 10px;
            }
            .print-item {
                border-bottom: 1px solid #ccc;
                margin-bottom: 8px;
                padding-bottom: 5px;
            }
            input[type="radio"] {
                accent-color: black;
            }
        }
    </style>
</head>
<body>

<div class="max-w-6xl mx-auto">
    <div class="text-center mb-6 no-print">
        <h1 class="text-3xl font-bold text-white">📋 Verifikasi Pentaksiran Berterusan</h1>
        <p class="text-purple-100">IPG Malaysia - Fasa Perancangan & Selepas Moderasi</p>
    </div>

    <!-- Tab Buttons -->
    <div class="flex justify-center gap-3 mb-6 no-print">
        <button id="btnPerancangan" class="tab-btn tab-active">📝 Perancangan</button>
        <button id="btnSelepas" class="tab-btn">✅ Selepas Moderasi</button>
    </div>

    <!-- FORM PERANCANGAN -->
    <div id="formPerancanganDiv" class="glass-card">
        <form id="formPerancangan">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div><label>IPG Kampus</label><input type="text" name="ipg_kampus" class="glass-input" required></div>
                <div><label>Kod Kursus</label><input type="text" name="kod_kursus" class="glass-input" required></div>
                <div><label>Nama Kursus</label><input type="text" name="nama_kursus" class="glass-input" required></div>
                <div><label>Program</label><select name="program" class="glass-select"><option>PPISMP</option><option>PISMP</option><option>PDPM</option><option>PDPP</option><option>PITO</option></select></div>
                <div><label>Semester/Tahun</label><input type="text" name="semester_tahun" class="glass-input" placeholder="Sem 3 Tahun 2"></div>
                <div><label>Tarikh Verifikasi</label><input type="date" name="tarikh_verifikasi" class="glass-input" required></div>
            </div>
            <div id="itemsPerancanganContainer" class="space-y-4 mb-6"></div>
            <div class="grid md:grid-cols-2 gap-4 mb-6">
                <div><label>Ulasan Keseluruhan</label><textarea name="ulasan_keseluruhan" rows="3" class="glass-textarea"></textarea></div>
                <div><label>Cadangan Penambahbaikan</label><textarea name="cadangan_penambahbaikan" rows="3" class="glass-textarea"></textarea></div>
            </div>
            <div class="mb-6 no-print">
                <label>Lampiran (fail)</label>
                <div id="dropAreaPerancangan" class="file-drop-area"><i class="fas fa-cloud-upload-alt"></i> Klik atau seret fail</div>
                <input type="file" id="fileInputPerancangan" multiple style="display:none">
                <div id="fileListPerancangan" class="mt-2 text-sm"></div>
            </div>
            <div class="flex justify-between no-print">
                <button type="button" id="cetakPerancanganBtn" class="bg-gray-700 text-white px-5 py-2 rounded-full"><i class="fas fa-print"></i> Cetak Borang</button>
                <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Hantar & Simpan</button>
            </div>
        </form>
    </div>

    <!-- FORM SELEPAS MODERASI (disembunyikan pada mulanya) -->
    <div id="formSelepasDiv" class="glass-card hidden">
        <form id="formSelepasModerasi">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div><label>IPG Kampus</label><input type="text" name="ipg_kampus" class="glass-input" required></div>
                <div><label>Kod Kursus</label><input type="text" name="kod_kursus" class="glass-input" required></div>
                <div><label>Nama Kursus</label><input type="text" name="nama_kursus" class="glass-input" required></div>
                <div><label>Program</label><select name="program" class="glass-select"><option>PPISMP</option><option>PISMP</option><option>PDPM</option><option>PDPP</option><option>PITO</option></select></div>
                <div><label>Semester/Tahun</label><input type="text" name="semester_tahun" class="glass-input"></div>
                <div><label>Tarikh Verifikasi</label><input type="date" name="tarikh_verifikasi" class="glass-input" required></div>
                <div><label>Tarikh Taklimat PB</label><input type="date" name="tarikh_taklimat_pb" class="glass-input"></div>
            </div>
            <div id="itemsSelepasContainer" class="space-y-4 mb-6"></div>
            <div class="grid md:grid-cols-2 gap-4 mb-6">
                <div><label>Ulasan Keseluruhan</label><textarea name="ulasan_keseluruhan" rows="3" class="glass-textarea"></textarea></div>
                <div><label>Cadangan Penambahbaikan</label><textarea name="cadangan_penambahbaikan" rows="3" class="glass-textarea"></textarea></div>
            </div>
            <div class="mb-6 no-print">
                <label>Lampiran (fail)</label>
                <div id="dropAreaSelepas" class="file-drop-area"><i class="fas fa-cloud-upload-alt"></i> Klik atau seret fail</div>
                <input type="file" id="fileInputSelepas" multiple style="display:none">
                <div id="fileListSelepas" class="mt-2 text-sm"></div>
            </div>
            <div class="flex justify-between no-print">
                <button type="button" id="cetakSelepasBtn" class="bg-gray-700 text-white px-5 py-2 rounded-full"><i class="fas fa-print"></i> Cetak Borang</button>
                <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Hantar & Simpan</button>
            </div>
        </form>
    </div>
</div>

<div id="loadingOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index:9999;" class="no-print"><div style="background:white; padding:20px; border-radius:20px;">Menyimpan data...</div></div>

<script>
    // ---------- SENARAI ITEMS ----------
    const itemsPerancangan = [
        "Pensyarah menerima arahan yang jelas pelaksanaan pentaksiran berterusan daripada Ketua Jabatan Akademik / Penyelaras Pentaksiran Berterusan",
        "JST yang disediakan mengikut format yang ditetapkan",
        "Tempoh pelaksanaan pentaksiran berterusan sesuai dengan bentuk tugasan dan selaras dengan RMK/MK",
        "Jam pembelajaran pelajar (JPP) sejajar dengan matriks hasil pembelajaran kursus dalam RMK/MK",
        "Hasil pembelajaran kursus (HPK) sejajar dengan matriks hasil pembelajaran kursus dalam RMK/MK",
        "Objektif tugasan memenuhi hasil pembelajaran kursus (HPK) yang telah ditetapkan dalam RMK/MK",
        "Wajaran markah tugasan mengikut wajaran dalam RMK/MK",
        "Aspek/ Kriteria penilaian dinyatakan dengan jelas untuk mentaksir tugasan yang diberikan",
        "Tugasan mempunyai elemen-elemen berikut: Rangsangan, Soalan tugasan, Arahan pentadbiran",
        "Kapasiti Pedagogi Pembelajaran Bermakna (Merungkai Standard, Merangkai Standard, Backward Design, Pelan Pembelajaran Bermakna - 6C, MPP, MRP, 3E & 3R)",
        "Tugasan yang disediakan mencapai Kemahiran Berfikir Aras Tinggi (KBAT) seperti yang dinyatakan dalam HPK",
        "Domain kognitif yang dinyatakan dalam HPK diuji dalam tugasan",
        "Domain psikomotor yang dinyatakan dalam HPK diuji dalam tugasan (jika berkenaan)",
        "Domain afektif yang dinyatakan dalam HPK diuji dalam tugasan (jika berkenaan)",
        "Domain kemahiran insaniah yang dinyatakan dalam HPK diuji dalam tugasan (jika berkenaan)",
        "Soalan tugasan telah disemak oleh Pakar Bidang / Penyelaras Kursus / Pensyarah Kanan",
        "Rubrik pemarkahan secara holistik / analitik disediakan selari dengan Jadual Spesifikasi Tugasan (JST) dan tugasan",
        "Skema pemarkahan dan Rubrik yang disediakan mengandungi kriteria / deskriptor untuk mengukur domain kognitif",
        "Skema pemarkahan dan Rubrik yang disediakan mengandungi kriteria / deskriptor untuk mengukur domain psikomotor (jika berkenaan)",
        "Skema pemarkahan dan Rubrik yang disediakan mengandungi kriteria / deskriptor untuk mengukur domain afektif (jika berkenaan)",
        "Skema pemarkahan dan Rubrik yang disediakan mengandungi kriteria / deskriptor untuk mengukur domain kemahiran insaniah (jika berkenaan)"
    ];

    const itemsSelepasModerasi = [
        "Pelajar menerima taklimat pentaksiran berterusan daripada pensyarah",
        "Pemilihan sampel dan penyelarasan skema pemarkahan dan rubrik dilaksanakan (sekiranya 2 @ lebih pemeriksa)",
        "Tugasan disemak oleh pensyarah berdasarkan skema pemarkahan dan rubrik pemarkahan yang disediakan",
        "Pemeriksa memberi komen/ ulasan dalam hasil tugasan pelajar",
        "Borang penyelarasan markah sebelum pemeriksaan diisi dengan lengkap (jika berkenaan)",
        "Pemeriksaan dan proses moderasi markah pentaksiran berterusan dijalankan mengikut prosedur",
        "Borang Moderasi (LAM PT04-02) diisi oleh panel moderasi dan ditandatangani oleh Ketua Pemeriksa",
        "Penentuan markah akhir dibuat berdasarkan prosedur (Rujuk Buku Panduan Pentaksiran)",
        "Borang markah pentaksiran berterusan (LAM PT04-01) diisi dengan lengkap dan tepat serta disemak oleh Ketua Jabatan Akademik",
        "Taburan markah pentaksiran berterusan mestilah sekurang-kurangnya terdiri daripada tiga gred merentasi dua kategori gred (A,A-,B) dan tidak terlalu terpencong. Jika sebaliknya perlu justifikasi dalam Laporan Panel Pemeriksa",
        "Laporan Panel Pemeriksa Pentaksiran Berterusan (LAM PT04-03) disediakan dengan lengkap",
        "Laporan Kes Gagal (LAM PT04-04) disediakan (jika ada)"
    ];

    // Fungsi untuk render item-item
    function renderItems(containerId, items, prefix) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = '';
        items.forEach((item, idx) => {
            const div = document.createElement('div');
            div.className = 'border-b border-white/20 pb-3';
            div.innerHTML = `
                <div class="flex flex-wrap items-start gap-2 mb-1">
                    <span class="font-bold bg-purple-800/40 px-2 py-0.5 rounded-full text-sm">${idx+1}</span>
                    <span class="flex-1">${escapeHtml(item)}</span>
                </div>
                <div class="flex flex-wrap gap-3 ml-6">
                    <label><input type="radio" name="${prefix}_${idx}" value="Ya"> Ya</label>
                    <label><input type="radio" name="${prefix}_${idx}" value="Tidak"> Tidak</label>
                    <label><input type="radio" name="${prefix}_${idx}" value="Tidak Berkaitan"> Tidak Berkaitan</label>
                    <input type="text" name="${prefix}_${idx}_catatan" placeholder="Catatan" class="glass-input w-64 text-sm">
                </div>
            `;
            container.appendChild(div);
        });
    }
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    renderItems('itemsPerancanganContainer', itemsPerancangan, 'item');
    renderItems('itemsSelepasContainer', itemsSelepasModerasi, 'item');

    // ---------- UPLOAD FILE ----------
    let currentFiles = { perancangan: [], selepas: [] };
    function setupUpload(areaId, inputId, listId, type) {
        const area = document.getElementById(areaId);
        const input = document.getElementById(inputId);
        const listDiv = document.getElementById(listId);
        if (!area || !input) return;
        area.addEventListener('click', () => input.click());
        area.addEventListener('dragover', e => e.preventDefault());
        area.addEventListener('drop', e => {
            e.preventDefault();
            handleFiles(e.dataTransfer.files, type, listDiv);
        });
        input.addEventListener('change', () => handleFiles(input.files, type, listDiv));
    }
    function handleFiles(files, type, listDiv) {
        for (let f of files) currentFiles[type].push(f);
        updateFileList(listDiv, currentFiles[type]);
    }
    function updateFileList(listDiv, files) {
        listDiv.innerHTML = files.map(f => `<div class="inline-block bg-white/20 rounded-full px-2 py-0.5 mr-1 mb-1">📄 ${f.name}</div>`).join('');
    }
    setupUpload('dropAreaPerancangan', 'fileInputPerancangan', 'fileListPerancangan', 'perancangan');
    setupUpload('dropAreaSelepas', 'fileInputSelepas', 'fileListSelepas', 'selepas');

    // ---------- TAB TOGGLE ----------
    function showTab(tab) {
        const perancanganDiv = document.getElementById('formPerancanganDiv');
        const selepasDiv = document.getElementById('formSelepasDiv');
        const btnPer = document.getElementById('btnPerancangan');
        const btnSel = document.getElementById('btnSelepas');
        if (tab === 'perancangan') {
            perancanganDiv.classList.remove('hidden');
            selepasDiv.classList.add('hidden');
            btnPer.classList.add('tab-active');
            btnSel.classList.remove('tab-active');
        } else {
            perancanganDiv.classList.add('hidden');
            selepasDiv.classList.remove('hidden');
            btnSel.classList.add('tab-active');
            btnPer.classList.remove('tab-active');
        }
    }
    document.getElementById('btnPerancangan').addEventListener('click', () => showTab('perancangan'));
    document.getElementById('btnSelepas').addEventListener('click', () => showTab('selepas'));
    showTab('perancangan');

    // ---------- CETAK BORANG (SOLID, PASTI BERFUNGSI) ----------
    function cetakBorang(formType) {
        // Paksa browser memaparkan dialog cetak
        window.print();
    }
    document.getElementById('cetakPerancanganBtn').addEventListener('click', () => cetakBorang('perancangan'));
    document.getElementById('cetakSelepasBtn').addEventListener('click', () => cetakBorang('selepas'));

    // ---------- HANTAR DATA KE GOOGLE SHEET (GUNA google.script.run) ----------
    async function callServer(fnName, ...args) {
        if (typeof google === 'undefined' || !google.script || !google.script.run) {
            throw new Error('Google Apps Script API tidak tersedia. Pastikan anda buka Web App melalui URL yang betul.');
        }
        return new Promise((resolve, reject) => {
            google.script.run
                .withSuccessHandler(resolve)
                .withFailureHandler(reject)
                [fnName](...args);
        });
    }

    async function submitForm(formElement, formType) {
        const formData = new FormData(formElement);
        const dataObj = {};
        for (let [k,v] of formData.entries()) dataObj[k] = v;
        const itemCount = formType === 'perancangan' ? 21 : 12;
        for (let i=0; i<itemCount; i++) {
            const key = `item_${i}`;
            if (!dataObj[key]) dataObj[key] = '';
        }
        const files = currentFiles[formType];
        const filesData = [];
        for (let file of files) {
            const reader = new FileReader();
            const base64 = await new Promise(resolve => { reader.onload = () => resolve(reader.result); reader.readAsDataURL(file); });
            filesData.push({ data: base64, name: file.name, mimeType: file.type });
        }
        const overlay = document.getElementById('loadingOverlay');
        overlay.style.display = 'flex';
        try {
            const result = await callServer('saveFormData', dataObj, filesData, formType);
            alert('✅ Data berjaya disimpan!');
            formElement.reset();
            currentFiles[formType] = [];
            updateFileList(document.getElementById(formType === 'perancangan' ? 'fileListPerancangan' : 'fileListSelepas'), []);
        } catch(err) {
            alert('❌ Ralat: ' + err.message);
        } finally {
            overlay.style.display = 'none';
        }
    }
    document.getElementById('formPerancangan').addEventListener('submit', e => { e.preventDefault(); submitForm(e.target, 'perancangan'); });
    document.getElementById('formSelepasModerasi').addEventListener('submit', e => { e.preventDefault(); submitForm(e.target, 'selepasmoderasi'); });
</script>
</body>
</html>
